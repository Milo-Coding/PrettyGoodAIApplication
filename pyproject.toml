[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pretty-good-ai-patient-bot"
version = "0.1.0"
description = "Patient voice bot for the Pretty Good AI engineering challenge"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.0.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "twilio>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patient_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
